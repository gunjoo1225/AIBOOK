<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비전캠프 사전 차량 등록</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a3a5c 0%, #2e6da4 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      padding: 40px 36px;
      width: 100%;
      max-width: 460px;
    }

    .card-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .card-header .icon { font-size: 48px; display: block; margin-bottom: 12px; }
    .card-header h1 { font-size: 22px; font-weight: 700; color: #1a3a5c; }
    .card-header p { margin-top: 6px; font-size: 13px; color: #888; }

    label.field-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
      margin-top: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d1dce8;
      border-radius: 8px;
      font-size: 16px;
      color: #222;
      transition: border-color 0.2s;
      outline: none;
    }
    input[type="text"]:focus { border-color: #2e6da4; }

    .date-section { margin-top: 20px; }
    .date-label { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 10px; display: block; }
    .date-options { display: flex; gap: 12px; }

    .date-checkbox { flex: 1; }
    .date-checkbox input[type="checkbox"] { display: none; }
    .date-checkbox label {
      display: flex; align-items: center; justify-content: center;
      padding: 12px 8px;
      border: 2px solid #d1dce8;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px; font-weight: 600; color: #666;
      transition: all 0.2s;
      user-select: none;
    }
    .date-checkbox input:checked + label { background: #2e6da4; border-color: #2e6da4; color: #fff; }
    .date-checkbox label:hover { border-color: #2e6da4; color: #2e6da4; }
    .date-checkbox input:checked + label:hover { background: #245d90; color: #fff; }

    #preview {
      margin-top: 12px;
      padding: 10px 14px;
      background: #f0f6ff;
      border-radius: 8px;
      font-size: 13px;
      color: #2e6da4;
      font-weight: 500;
      min-height: 38px;
      display: flex;
      align-items: center;
    }
    #preview span { color: #888; }

    .submit-btn {
      margin-top: 28px;
      width: 100%;
      padding: 15px;
      background: #2e6da4;
      color: #fff;
      font-size: 16px; font-weight: 700;
      border: none; border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .submit-btn:hover { background: #245d90; }
    .submit-btn:disabled { background: #93b8d8; cursor: not-allowed; }

    .alert {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px; font-weight: 500;
      display: none;
    }
    .alert.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .alert.error   { background: #fdecea; color: #c62828; border: 1px solid #ef9a9a; }

    .setup-warning {
      margin-top: 20px;
      padding: 14px 16px;
      background: #fffbeb;
      border: 1.5px solid #fcd34d;
      border-radius: 10px;
      font-size: 13px;
      color: #92400e;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <span class="icon">🚗</span>
      <h1>비전캠프 사전 차량 등록</h1>
      <p>2026년 6월 22일 ~ 24일 · 비전캠프</p>
    </div>

    <form id="regForm" autocomplete="off">
      <label class="field-label" for="name">이름</label>
      <input type="text" id="name" placeholder="홍길동" required />

      <label class="field-label" for="vehicle">차량번호</label>
      <input type="text" id="vehicle" placeholder="12가 3456" required />

      <div class="date-section">
        <span class="date-label">참석일 선택 (복수 선택 가능)</span>
        <div class="date-options">
          <div class="date-checkbox">
            <input type="checkbox" id="d22" value="22" />
            <label for="d22">6.22</label>
          </div>
          <div class="date-checkbox">
            <input type="checkbox" id="d23" value="23" />
            <label for="d23">6.23</label>
          </div>
          <div class="date-checkbox">
            <input type="checkbox" id="d24" value="24" />
            <label for="d24">6.24</label>
          </div>
        </div>
        <div id="preview"><span>참석일을 선택해주세요</span></div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">등록하기</button>
    </form>

    <div id="alert" class="alert"></div>
    <div class="setup-warning" id="setupWarn">
      ⚠️ Apps Script URL이 설정되지 않았습니다.<br>
      index.html 상단의 <strong>SCRIPT_URL</strong>을 입력해주세요.
    </div>

    <a href="../../index.html" style="display:flex;align-items:center;gap:12px;margin-top:20px;padding:14px 18px;background:#f0f6ff;border:1.5px solid #c7d2fe;border-radius:12px;text-decoration:none;transition:background 0.2s;" onmouseover="this.style.background='#e0e7ff'" onmouseout="this.style.background='#f0f6ff'">
      <span style="font-size:28px;flex-shrink:0;">🏠</span>
      <div style="flex:1;">
        <div style="font-size:14px;font-weight:700;color:#3730a3;">메뉴로 돌아가기</div>
        <div style="font-size:12px;color:#6366f1;margin-top:2px;">비전캠프 사전 준비 가이드</div>
      </div>
      <span style="font-size:18px;color:#4f46e5;">←</span>
    </a>

    <a href="https://docs.google.com/spreadsheets/d/1BzTAKI1292TdctGy47EwUca8rvTrtxNoBYXGrAn29-M/edit" target="_blank" style="display:flex;align-items:center;gap:12px;margin-top:10px;padding:14px 18px;background:#f0fdf4;border:1.5px solid #86efac;border-radius:12px;text-decoration:none;transition:background 0.2s;" onmouseover="this.style.background='#dcfce7'" onmouseout="this.style.background='#f0fdf4'">
      <span style="font-size:28px;flex-shrink:0;">📋</span>
      <div style="flex:1;">
        <div style="font-size:14px;font-weight:700;color:#166534;">차량등록 확인하기</div>
        <div style="font-size:12px;color:#4ade80;margin-top:2px;color:#16a34a;">구글 시트에서 직접 확인 및 수정</div>
      </div>
      <span style="font-size:18px;color:#16a34a;">→</span>
    </a>
  </div>

  <script>
    // ★ 여기에 Apps Script 배포 URL을 붙여넣으세요 ★
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwq7HbBUWkm5vFJvY7iF7QtwAb34cx3AZGs-2qAJkwVs4ESl85OA9-5qbzbYgm0-UUp/exec';

    const checkboxes = document.querySelectorAll('.date-checkbox input[type="checkbox"]');
    const preview    = document.getElementById('preview');

    function formatDates(days) {
      if (!days.length) return null;
      const sorted = [...days].sort((a, b) => a - b);
      const ranges = [];
      let start = sorted[0], end = sorted[0];
      for (let i = 1; i < sorted.length; i++) {
        if (sorted[i] === end + 1) { end = sorted[i]; }
        else {
          ranges.push(start === end ? `6.${start}` : `6.${start}-${end}`);
          start = end = sorted[i];
        }
      }
      ranges.push(start === end ? `6.${start}` : `6.${start}-${end}`);
      return ranges.join(', ');
    }

    function updatePreview() {
      const selected = [...checkboxes].filter(c => c.checked).map(c => parseInt(c.value));
      const fmt = formatDates(selected);
      preview.innerHTML = fmt
        ? `참석일: <strong style="margin-left:6px">${fmt}</strong>`
        : '<span>참석일을 선택해주세요</span>';
    }
    checkboxes.forEach(c => c.addEventListener('change', updatePreview));

    function showAlert(type, msg) {
      const el = document.getElementById('alert');
      el.className = `alert ${type}`;
      el.textContent = msg;
      el.style.display = 'block';
      if (type === 'success') setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!SCRIPT_URL) {
        document.getElementById('setupWarn').style.display = 'block';
        return;
      }

      const name    = document.getElementById('name').value.trim();
      const vehicle = document.getElementById('vehicle').value.trim();
      const selected = [...checkboxes].filter(c => c.checked).map(c => parseInt(c.value));

      if (!name)            return showAlert('error', '이름을 입력해주세요.');
      if (!vehicle)         return showAlert('error', '차량번호를 입력해주세요.');
      if (!selected.length) return showAlert('error', '참석일을 하나 이상 선택해주세요.');

      const dates = formatDates(selected);
      const btn   = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '등록 중...';

      try {
        const url = `${SCRIPT_URL}?action=register&name=${encodeURIComponent(name)}&vehicle=${encodeURIComponent(vehicle)}&dates=${encodeURIComponent(dates)}`;
        const res  = await fetch(url);
        const data = await res.json();

        if (data.success) {
          showAlert('success', `✅ 등록 완료! ${name}님 (${vehicle}) - ${dates}`);
          document.getElementById('regForm').reset();
          updatePreview();
        } else {
          showAlert('error', data.error || '등록에 실패했습니다.');
        }
      } catch {
        showAlert('error', '서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요.');
      } finally {
        btn.disabled = false;
        btn.textContent = '등록하기';
      }
    });

    if (!SCRIPT_URL) document.getElementById('setupWarn').style.display = 'block';
  </script>
</body>
</html>
