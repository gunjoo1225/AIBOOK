<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[테스트] 워크샵 차량 등록</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a3a5c 0%, #2e6da4 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      padding: 20px;
    }

    .test-banner {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #dc2626;
      color: #fff;
      text-align: center;
      padding: 8px;
      font-size: 13px;
      font-weight: 700;
      z-index: 999;
      letter-spacing: 0.5px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      padding: 40px 36px;
      width: 100%;
      max-width: 460px;
      margin-top: 36px;
    }

    .card-header { text-align: center; margin-bottom: 32px; }
    .card-header .icon { font-size: 48px; display: block; margin-bottom: 12px; }
    .card-header h1 { font-size: 22px; font-weight: 700; color: #1a3a5c; }
    .card-header p { margin-top: 6px; font-size: 13px; color: #888; }

    label.field-label {
      display: block;
      font-size: 13px; font-weight: 600; color: #444;
      margin-bottom: 6px; margin-top: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d1dce8;
      border-radius: 8px;
      font-size: 16px; color: #222;
      transition: border-color 0.2s; outline: none;
    }
    input[type="text"]:focus { border-color: #2e6da4; }

    .date-section { margin-top: 20px; }
    .date-label { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 10px; display: block; }
    .date-options { display: flex; gap: 12px; }

    .date-checkbox { flex: 1; }
    .date-checkbox input[type="checkbox"] { display: none; }
    .date-checkbox label {
      display: flex; align-items: center; justify-content: center;
      padding: 12px 8px;
      border: 2px solid #d1dce8; border-radius: 10px;
      cursor: pointer; font-size: 15px; font-weight: 600; color: #666;
      transition: all 0.2s; user-select: none;
    }
    .date-checkbox input:checked + label { background: #2e6da4; border-color: #2e6da4; color: #fff; }
    .date-checkbox label:hover { border-color: #2e6da4; color: #2e6da4; }
    .date-checkbox input:checked + label:hover { background: #245d90; color: #fff; }

    #preview {
      margin-top: 12px; padding: 10px 14px;
      background: #f0f6ff; border-radius: 8px;
      font-size: 13px; color: #2e6da4; font-weight: 500;
      min-height: 38px; display: flex; align-items: center;
    }
    #preview span { color: #888; }

    .submit-btn {
      margin-top: 28px; width: 100%; padding: 15px;
      background: #2e6da4; color: #fff;
      font-size: 16px; font-weight: 700;
      border: none; border-radius: 10px;
      cursor: pointer; transition: background 0.2s;
    }
    .submit-btn:hover { background: #245d90; }
    .submit-btn:disabled { background: #93b8d8; cursor: not-allowed; }

    .alert {
      margin-top: 16px; padding: 12px 16px;
      border-radius: 8px; font-size: 14px; font-weight: 500;
      display: none;
    }
    .alert.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .alert.error   { background: #fdecea; color: #c62828; border: 1px solid #ef9a9a; }

    .log-box {
      margin-top: 16px;
      background: #1e1e1e;
      color: #4ade80;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12px;
      font-family: monospace;
      max-height: 160px;
      overflow-y: auto;
      display: none;
    }
    .log-box .log-line { margin-bottom: 4px; }
    .log-box .log-err  { color: #f87171; }
  </style>
</head>
<body>

  <div class="test-banner">🧪 테스트 모드 — 실제 구글 시트에 저장됩니다</div>

  <div class="card">
    <div class="card-header">
      <span class="icon">🚗</span>
      <h1>워크샵 차량 등록</h1>
      <p>2026년 6월 22일 ~ 24일 · 비전캠프</p>
    </div>

    <form id="regForm" autocomplete="off">
      <label class="field-label" for="name">이름</label>
      <input type="text" id="name" placeholder="홍길동" required />

      <label class="field-label" for="vehicle">차량번호</label>
      <input type="text" id="vehicle" placeholder="12가 3456" required />

      <div class="date-section">
        <span class="date-label">참석일 선택 (복수 선택 가능)</span>
        <div class="date-options">
          <div class="date-checkbox">
            <input type="checkbox" id="d22" value="22" />
            <label for="d22">6.22</label>
          </div>
          <div class="date-checkbox">
            <input type="checkbox" id="d23" value="23" />
            <label for="d23">6.23</label>
          </div>
          <div class="date-checkbox">
            <input type="checkbox" id="d24" value="24" />
            <label for="d24">6.24</label>
          </div>
        </div>
        <div id="preview"><span>참석일을 선택해주세요</span></div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">등록하기</button>
    </form>

    <div id="alert" class="alert"></div>

    <!-- 테스트용 로그 -->
    <div class="log-box" id="logBox"></div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwq7HbBUWkm5vFJvY7iF7QtwAb34cx3AZGs-2qAJkwVs4ESl85OA9-5qbzbYgm0-UUp/exec';

    const checkboxes = document.querySelectorAll('.date-checkbox input[type="checkbox"]');
    const preview    = document.getElementById('preview');
    const logBox     = document.getElementById('logBox');

    function log(msg, isErr = false) {
      logBox.style.display = 'block';
      const line = document.createElement('div');
      line.className = 'log-line' + (isErr ? ' log-err' : '');
      line.textContent = `[${new Date().toLocaleTimeString('ko-KR')}] ${msg}`;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function formatDates(days) {
      if (!days.length) return null;
      const sorted = [...days].sort((a, b) => a - b);
      const ranges = [];
      let start = sorted[0], end = sorted[0];
      for (let i = 1; i < sorted.length; i++) {
        if (sorted[i] === end + 1) { end = sorted[i]; }
        else {
          ranges.push(start === end ? `6.${start}` : `6.${start}-${end}`);
          start = end = sorted[i];
        }
      }
      ranges.push(start === end ? `6.${start}` : `6.${start}-${end}`);
      return ranges.join(', ');
    }

    function updatePreview() {
      const selected = [...checkboxes].filter(c => c.checked).map(c => parseInt(c.value));
      const fmt = formatDates(selected);
      preview.innerHTML = fmt
        ? `참석일: <strong style="margin-left:6px">${fmt}</strong>`
        : '<span>참석일을 선택해주세요</span>';
    }
    checkboxes.forEach(c => c.addEventListener('change', updatePreview));

    function showAlert(type, msg) {
      const el = document.getElementById('alert');
      el.className = `alert ${type}`;
      el.textContent = msg;
      el.style.display = 'block';
      if (type === 'success') setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name    = document.getElementById('name').value.trim();
      const vehicle = document.getElementById('vehicle').value.trim();
      const selected = [...checkboxes].filter(c => c.checked).map(c => parseInt(c.value));

      if (!name)            return showAlert('error', '이름을 입력해주세요.');
      if (!vehicle)         return showAlert('error', '차량번호를 입력해주세요.');
      if (!selected.length) return showAlert('error', '참석일을 하나 이상 선택해주세요.');

      const dates = formatDates(selected);
      const btn   = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '등록 중...';

      const url = `${SCRIPT_URL}?action=register&name=${encodeURIComponent(name)}&vehicle=${encodeURIComponent(vehicle)}&dates=${encodeURIComponent(dates)}`;
      log(`요청: ${name} / ${vehicle} / ${dates}`);
      log(`URL: ${url}`);

      try {
        const res  = await fetch(url);
        const data = await res.json();
        log(`응답: ${JSON.stringify(data)}`);

        if (data.success) {
          showAlert('success', `✅ 등록 완료! ${name}님 (${vehicle}) - ${dates}`);
          document.getElementById('regForm').reset();
          updatePreview();
        } else {
          showAlert('error', data.error || '등록에 실패했습니다.');
          log(data.error || '실패', true);
        }
      } catch (err) {
        showAlert('error', '서버 연결에 실패했습니다.');
        log(`오류: ${err.message}`, true);
      } finally {
        btn.disabled = false;
        btn.textContent = '등록하기';
      }
    });
  </script>
</body>
</html>
