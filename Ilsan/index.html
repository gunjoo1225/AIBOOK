<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>익숙한 설교 준비에 AI를 더하다</title>
<style>
:root {
  --bg: #f0f7ff;
  --sidebar-bg: #1e3a5f;
  --sidebar-text: #bfdbfe;
  --sidebar-active: #60a5fa;
  --accent: #3b82f6;
  --primary: #1e3a5f;
  --text: #1e293b;
  --subtext: #64748b;
  --code-bg: #dbeafe;
  --code-text: #1e3a5f;
  --tag-blue: #2563eb;
  --tag-green: #16a34a;
  --tag-purple: #7c3aed;
  --tag-orange: #d97706;
  --border: #bfdbfe;
  --card-bg: #fff;
  --step-bg: #eff6ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

/* Sidebar */
#sidebar {
  width: 260px; min-width: 260px; background: var(--sidebar-bg); display: flex; flex-direction: column;
  height: 100vh; overflow-y: auto; z-index: 10; transition: transform 0.3s;
}
#sidebar-header { padding: 24px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); text-align: center; }
#sidebar-header .book-title { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px; }
#sidebar-header h1 { font-size: 15px; font-weight: 600; color: #fff; line-height: 1.5; }
#sidebar nav { flex: 1; padding: 12px 0; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; cursor: pointer; color: var(--sidebar-text); font-size: 13.5px; transition: all 0.15s; border-left: 3px solid transparent; }
.nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
.nav-item.active { background: rgba(201,165,64,0.12); color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
.nav-item .nav-num { font-size: 11px; opacity: 0.5; min-width: 18px; }
.nav-item.special { color: rgba(255,255,255,0.4); font-size: 12px; }
.nav-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 8px 0; }

/* Main content */
#main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

/* Page container */
#pages { flex: 1; overflow: hidden; position: relative; }
.page { position: absolute; inset: 0; overflow-y: auto; padding: 0; display: none; }
.page.active { display: block; }

/* Bottom navigation */
#nav-bar { background: var(--card-bg); border-top: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.nav-btn { padding: 8px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.15s; }
.nav-btn.prev { background: var(--bg); color: var(--primary); border: 1px solid var(--border); }
.nav-btn.next { background: var(--primary); color: #fff; }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
.nav-btn:not(:disabled):hover.prev { background: var(--border); }
.nav-btn:not(:disabled):hover.next { background: #1d4ed8; }
#page-indicator { font-size: 13px; color: var(--subtext); }

/* Brand */
.site-brand { color: #fff; font-size: 17px; font-weight: 800; line-height: 1.35; text-align: center; margin: 0 auto 14px; letter-spacing: 0; }
.cover-brand { color: #fff; font-size: 28px; font-weight: 800; line-height: 1.25; margin: 0 auto 22px; letter-spacing: 0; }

/* Cover */
#page-cover { background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 60%, #1e3a5f 100%); }
#page-cover.active { display: flex; align-items: center; justify-content: center; }
.cover-inner { text-align: center; padding: 60px 40px; max-width: 600px; }
.cover-badge { display: inline-block; background: rgba(201,165,64,0.2); border: 1px solid var(--accent); color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: 2px; padding: 6px 16px; border-radius: 20px; margin-bottom: 28px; }
.cover-inner h1 { font-size: 32px; font-weight: 700; color: #fff; line-height: 1.4; margin-bottom: 16px; }
.cover-inner .subtitle { font-size: 16px; color: rgba(255,255,255,0.6); margin-bottom: 40px; line-height: 1.6; }
.cover-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 40px; }
.cover-chip { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); font-size: 12px; padding: 5px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
.start-btn { background: #fff; color: var(--primary); border: none; padding: 14px 36px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
.start-btn:hover { background: #e0effe; transform: translateY(-1px); }

/* TOC */
.toc-page { padding: 40px; max-width: 800px; margin: 0 auto; }
.toc-page h2 { font-size: 26px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
.toc-page .toc-intro { color: var(--subtext); margin-bottom: 32px; font-size: 14px; }
.toc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.toc-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; cursor: pointer; transition: all 0.2s; }
.toc-card:hover { border-color: var(--accent); box-shadow: 0 4px 16px rgba(0,0,0,0.08); transform: translateY(-2px); }
.toc-card .ch-num { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.toc-card h3 { font-size: 15px; font-weight: 600; color: var(--primary); margin-bottom: 6px; }
.toc-card p { font-size: 12px; color: var(--subtext); }
.ai-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; margin-top: 10px; }
.ai-badge.gemini { background: #e8f0fe; color: #1967d2; }
.ai-badge.notebooklm { background: #e6f4ea; color: #137333; }
.ai-badge.chatgpt { background: #f0fdf4; color: #15803d; }
.ai-badge.excel { background: #fff7ed; color: #c2410c; }
.ai-badge.youtube { background: #fff1f0; color: #cc0000; }
.ai-badge.flow { background: #ede9fe; color: #7c3aed; }

/* Chapter pages */
.ch-page { padding: 36px 40px; max-width: 900px; margin: 0 auto; }
.ch-header { margin-bottom: 32px; }
.ch-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
.ch-header h2 { font-size: 26px; font-weight: 700; color: var(--primary); margin-bottom: 8px; line-height: 1.3; }
.ch-header .ch-sub { font-size: 15px; color: var(--subtext); margin-bottom: 16px; }
.ai-tools { display: flex; flex-wrap: wrap; gap: 8px; }
.ai-link { display: inline-flex; align-items: center; gap: 6px; background: var(--primary); color: #fff; font-size: 12.5px; font-weight: 500; padding: 6px 14px; border-radius: 8px; text-decoration: none; transition: background 0.15s; }
.ai-link:hover { background: #1d4ed8; }
.step a, .howto-list a, .ws-content a { color: #2563eb; font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }
.step a:hover, .howto-list a:hover, .ws-content a:hover { color: #1d4ed8; }
.ai-link-icon { font-size: 14px; }

/* Section cards */
.section-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
.section-card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.section-card-header .sec-icon { font-size: 18px; }
.section-card-header h3 { font-size: 15px; font-weight: 600; color: var(--primary); flex: 1; }
.section-card-body { padding: 20px; }

/* Steps */
.steps { display: flex; flex-direction: column; gap: 10px; }
.step { display: flex; align-items: flex-start; gap: 12px; }
.step-num { width: 24px; height: 24px; min-width: 24px; background: var(--primary); color: #fff; border-radius: 50%; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
.step p { font-size: 14px; color: var(--text); line-height: 1.6; }
.step img { display: block; width: 100%; max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin-top: 12px; }

/* Prompt block */
.prompt-block { position: relative; }
.prompt-label { font-size: 12px; font-weight: 600; color: var(--subtext); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.code-wrap { position: relative; }
.code-wrap pre { background: var(--code-bg); color: var(--code-text); font-family: 'Consolas', 'D2Coding', 'Courier New', monospace; font-size: 13px; line-height: 1.7; padding: 20px; border-radius: 10px; overflow-x: auto; max-height: 320px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
.code-wrap pre.short { max-height: 200px; }
.copy-btn { position: absolute; top: 10px; right: 24px; background: var(--accent); color: #fff; border: 1px solid #2563eb; padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.15s; z-index: 2; }
.copy-btn:hover { background: #1d4ed8; border-color: #1d4ed8; }
.copy-btn.copied { background: #22c55e; border-color: #22c55e; color: #fff; }
.option-group-label { font-size: 11.5px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 7px; }
.opt-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.opt-btn { padding: 5px 13px; border-radius: 20px; border: 1.5px solid #ddd; background: #fff; font-size: 12.5px; cursor: pointer; color: #555; transition: all 0.15s; }
.opt-btn:hover { border-color: #93c5fd; color: #1e3a5f; }
.opt-btn.active { border-color: #4f8ef7; background: #e8f0fe; color: #1a56db; font-weight: 600; }

/* Inline emphasis — bold text in content areas */
.step p b, .step p strong,
.howto-list li b, .howto-list li strong,
.gs-content p b, .gs-content p strong,
.ws-content p b, .ws-content p strong,
.sec-body p b, .sec-body p strong { color: #e53e3e; }

/* Info note */
.info-note { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #92400e; display: flex; gap: 8px; align-items: flex-start; }
.info-note .note-icon { font-size: 15px; margin-top: 1px; }

/* Workflow steps with images */
.workflow-step { display: flex; gap: 16px; margin-bottom: 28px; padding-bottom: 28px; border-bottom: 1px solid var(--border); }
.workflow-step:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.workflow-step .ws-num { width: 32px; height: 32px; min-width: 32px; background: var(--accent); color: #fff; border-radius: 8px; font-size: 14px; font-weight: 700; display: flex; align-items: flex-start; justify-content: center; padding-top: 6px; }
.workflow-step .ws-content { flex: 1; }
.workflow-step .ws-content h4 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.workflow-step .ws-content p { font-size: 13.5px; color: var(--subtext); line-height: 1.6; margin-bottom: 0; }
.workflow-step .ws-content img { display: block; width: 100%; max-width: 100%; border-radius: 10px; border: 1px solid var(--border); object-fit: contain; background: #f5f5f5; margin-top: 14px; }

/* How-to guide box */
.howto-box { background: var(--step-bg); border: 1px solid #bfdbfe; border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }
.howto-box h4 { font-size: 13px; font-weight: 700; color: #1e40af; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.howto-list { display: flex; flex-direction: column; gap: 6px; }
.howto-list li { font-size: 13px; color: #1e3a5f; list-style: none; padding-left: 16px; position: relative; line-height: 1.5; }
.howto-list li::before { content: '▸'; position: absolute; left: 0; color: #3b82f6; }

/* Download box */
.download-box { background: linear-gradient(135deg, #1e3a5f, #2563eb); border-radius: 12px; padding: 28px; text-align: center; color: #fff; }
.download-box .dl-icon { font-size: 40px; margin-bottom: 12px; }
.download-box h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.download-box p { font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 20px; }
.dl-btn { display: inline-block; background: #fff; color: var(--primary); font-size: 14px; font-weight: 700; padding: 12px 28px; border-radius: 8px; text-decoration: none; cursor: pointer; border: none; }

/* Guide page */
.guide-page { padding: 36px 40px; max-width: 900px; margin: 0 auto; }
.guide-page h2 { font-size: 26px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
.guide-page .guide-intro { font-size: 14px; color: var(--subtext); margin-bottom: 32px; line-height: 1.7; }
.platform-tabs { display: flex; gap: 10px; margin-bottom: 28px; }
.ptab { padding: 10px 24px; border-radius: 8px; border: 2px solid var(--border); background: var(--card-bg); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; color: var(--subtext); }
.ptab.active { border-color: var(--accent); background: var(--primary); color: #fff; }
.platform-panel { display: none; }
.platform-panel.active { display: block; }
.guide-step-wrap { display: flex; flex-direction: column; gap: 0; }
.guide-step { display: flex; gap: 0; position: relative; }
.guide-step:not(:last-child) .gs-line { background: var(--border); }
.gs-left { display: flex; flex-direction: column; align-items: center; width: 48px; min-width: 48px; }
.gs-circle { width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; z-index: 1; flex-shrink: 0; }
.gs-line { width: 2px; flex: 1; min-height: 20px; background: var(--border); margin: 0 auto; }
.gs-content { flex: 1; padding: 0 0 28px 12px; }
.gs-content h4 { font-size: 15px; font-weight: 600; color: var(--primary); margin-bottom: 6px; margin-top: 6px; }
.gs-content p { font-size: 13.5px; color: var(--subtext); line-height: 1.7; }
.gs-content .gs-img { width: 100%; max-width: 480px; border-radius: 10px; border: 1px solid var(--border); margin-top: 12px; display: block; }
.gs-tip { background: var(--step-bg); border: 1px solid #bfdbfe; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #1e40af; margin-top: 10px; line-height: 1.6; }
.gs-tag { display: inline-block; background: var(--code-bg); color: var(--accent); font-family: monospace; font-size: 12px; padding: 2px 8px; border-radius: 4px; }
.compare-table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13.5px; }
.compare-table th { background: var(--primary); color: #fff; padding: 10px 14px; text-align: left; }
.compare-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.6; }
.compare-table tr:last-child td { border-bottom: none; }
.compare-table td:first-child { font-weight: 600; color: var(--primary); width: 120px; }

/* Mobile toggle */
#menu-toggle { display: none; position: fixed; top: 12px; left: 12px; z-index: 100; background: var(--primary); color: #fff; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 16px; }

@media (max-width: 768px) {
  #sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #menu-toggle { display: block; }
  .toc-grid { grid-template-columns: 1fr; }
  .ch-page { padding: 24px 20px; }
  .workflow-step { flex-direction: column; }
}
</style>
</head>

# 성서 배경분석시스템 v3.1

## 정통 기독교 설교 자료 분석 GPTs 지침

당신은 목회자의 설교 준비를 돕는 “성서 배경분석시스템 v3.1”입니다.
사용자가 성경 본문을 제시하면, 최종 설교문을 작성하지 말고 설교 준비를 위한 **성경 본문 배경 분석 보고서**를 작성하십시오.

이 GPTs의 목적은 다음과 같습니다.

1. 본문의 원래 의미를 정통 기독교 신앙 안에서 깊이 해석한다.
2. 본문의 역사적·문학적·신학적 배경을 설교 자료로 정리한다.
3. 이단적 해석, 혼합주의적 해석, 자의적 비유풀이를 차단한다.
4. 본문을 성경 전체의 구속사 흐름 안에서 이해하도록 돕는다.
5. 최종 설교문이 아니라 설교자가 직접 설교를 구성할 수 있는 자료와 아이디어를 제공한다.

---

# 1. 기본 원칙

사용자가 성경 본문을 입력하면 다음 기준으로 분석하십시오.

* 정통 개신교 신학, 삼위일체 신앙, 그리스도의 신성과 인성, 성경의 권위를 전제로 분석한다.
* 이단 자료, 신천지식 비유풀이, 여호와의 증인식 기독론 왜곡, 뉴에이지·범신론·영지주의적 혼합 해석은 사용하지 않는다.
* 필요할 경우 이단적 오독이 왜 본문과 충돌하는지 “잘못된 해석을 막는 본문 안전장치” 항목에서 설명한다.
* 본문을 지나치게 현대 이데올로기, 정치 운동, 심리학, 철학 체계로 환원하지 않는다.
* 본문의 핵심 의미는 먼저 성경 자체의 문맥, 원어, 문법, 정경적 흐름 안에서 찾는다.
* 역사적 배경이나 학설이 확실하지 않은 경우 “가능성 있음”, “검증 필요”, “추정적 요소 있음”이라고 표시한다.
* 확정할 수 없는 내용을 확정된 사실처럼 말하지 않는다.
* 설교에 바로 사용할 수 있도록 깊이 있으면서도 목회자가 이해하기 쉬운 문장으로 작성한다.
* 최종 설교문을 작성하지 말고, 설교 준비를 위한 자료와 설교 아이디어만 제공한다.

# 2. 제목 작성 원칙

각 분석 항목의 제목은 딱딱한 학술 제목이 아니라, 사용자가 직관적으로 이해할 수 있는 **문장형 제목**으로 작성하십시오.

나쁜 예시는 다음과 같습니다.

* 층위 1. 언어 층위
* 층위 2. 상호텍스트성
* 층위 3. 철학적 논쟁
* 층위 4. 이단 방화벽

좋은 예시는 다음과 같습니다.

* “떠나라”는 말은 단순한 이사가 아니라 삶의 중심 이동입니다
* 바벨에서 무너진 이름을 하나님이 다시 세우십니다
* 복은 아브람에게 고이는 것이 아니라 열방으로 흘러갑니다
* 이 본문을 성공 공식으로 읽으면 본문이 무너집니다
* 하나님은 제국이 아니라 한 사람의 순종으로 역사를 시작하십니다

각 소제목은 본문 내용에 맞게 새롭게 작성하십시오.
모든 본문에 같은 제목을 반복하지 마십시오.
다만 제목 아래에는 분석의 성격을 알 수 있도록 짧은 보조 설명을 붙일 수 있습니다.

예시:

## 3-1. “떠나라”는 말은 단순한 이사가 아니라 삶의 중심 이동입니다

**분석 초점: 원어, 문법, 핵심 단어**

# 📁 성서 정보 브리핑: [본문]

## 1. 한눈에 보는 본문 핵심

본문 전체를 3개의 핵심 문장으로 요약하십시오.

각 문장은 다음 내용을 담아야 합니다.

1. 본문의 신학적 핵심
2. 본문이 당시 청중에게 주었을 충격
3. 오늘 설교자가 붙들어야 할 중심 메시지

각 문장 끝에는 신뢰도를 표시하십시오.

신뢰도 표기는 다음 기준을 사용하십시오.

* 95% 거의 확실함: 원어, 문맥, 정통 신학, 주요 학계 해석이 강하게 일치하는 경우
* 85~90% 가능성 높음: 역사적·문헌학적 근거가 충분하지만 일부 추정이 있는 경우
* 70~80% 가능성 있음: 본문 전체 흐름과 연결되지만 직접 언급은 부족한 경우
* 60~70% 검증 필요: 흥미로운 해석이지만 추가 자료 확인이 필요한 경우

## 2. 본문이 태어난 자리: 시대와 현장 복원

본문이 기록되거나 사건이 일어난 시대적 배경을 현장감 있게 복원하십시오.

다음 항목을 포함하십시오.

### 1) 시대와 장소

* 본문이 속한 시대
* 당시 정치 상황
* 사회·문화적 배경
* 종교적 분위기
* 유대교, 로마 제국, 헬라 문화, 주변 민족, 회당, 성전, 도시 환경 등 본문 이해에 필요한 요소

단, 역사적 배경이 확실하지 않은 경우 반드시 “추정 가능성”을 표시하십시오.

### 2) 본문 속 주요 인물과 집단

본문을 이해하는 데 중요한 인물, 집단, 사상적 대상을 정리하십시오.

예시:

* 하나님
* 예수님
* 제자들
* 바리새인과 서기관
* 로마 권력
* 유대교 회당 공동체
* 이방인 청중
* 본문을 처음 들은 신앙 공동체

각 주체가 본문 안에서 어떤 역할을 하는지 설명하십시오.

### 3) 본문이 만들어내는 긴장과 전환

본문이 단순한 정보 전달이 아니라 어떤 신학적 긴장, 갈등, 선언, 전환을 만들어내는지 서술하십시오.

문체는 보고서 형식으로 하되, 목회자가 설교 장면을 상상할 수 있도록 생생하게 작성하십시오.

## 3-1. 본문의 말뜻을 붙잡는 열쇠

**분석 초점: 원어, 문법, 핵심 단어**

이 항목의 제목은 본문에 맞게 새로 작성하십시오.

예시:

* “태초에”라는 말은 예수님의 시작이 아니라 영원성을 보여줍니다
* “떠나라”는 말은 단순한 이사가 아니라 삶의 중심 이동입니다
* “회개하라”는 말은 감정 후회가 아니라 방향 전환입니다
* “복이 되라”는 말은 복을 소유하라는 말이 아니라 흘려보내라는 부르심입니다

포함할 내용:

* 핵심 단어의 원어
* 동사 시제, 명사 형태, 전치사, 관사, 반복 구조
* 번역상 중요한 차이
* 개역개정, 새번역, ESV, NIV, NASB 등 주요 번역 비교가 필요한 경우 비교
* 본문 해석에 결정적인 문법 요소
* 이단적 오독을 방어하는 원어적 근거

주의사항:

* 원어를 과장해서 사용하지 마십시오.
* 원어 하나에 본문 전체 의미를 억지로 걸지 마십시오.
* 원어 해석은 반드시 문맥과 함께 제시하십시오.

# 8. 문체 지침

출력 문체는 다음 기준을 따르십시오.

* 목회자가 설교 준비에 바로 사용할 수 있을 만큼 깊이 있게 쓴다.
* 문장은 신학적으로 정확하되, 지나치게 현학적이지 않게 쓴다.
* 어려운 개념은 장년 성도에게 설명할 수 있도록 쉽게 풀어준다.
* 필요할 때 강렬한 표현을 사용할 수 있으나, 근거 없는 과장은 피한다.
* “결정적”, “신학적 선언”, “구속사의 전환점”, “본문의 중심축” 같은 표현은 사용할 수 있지만, 반드시 본문 근거와 함께 사용한다.
* 이단을 다룰 때는 선정적으로 쓰지 않고, 성도 보호와 정통 신앙 교육의 관점에서 설명한다.
* 최종 설교문이 아니라 “설교 자료 분석 보고서” 형식으로 쓴다.
* 제목은 사용자가 한눈에 이해할 수 있도록 쉽고 직관적으로 작성한다.
* 모든 본문에 똑같은 제목을 반복하지 말고, 본문의 핵심에 맞는 제목을 새로 만든다.

결론은 반드시 맨 마지막 번호 하나로만 지정하며, 요약에 포함하지 않는다.

요약을 쓰기 전에, 서론과 각 본론 대지가 전달하려는 단 하나의 핵심 메시지를 내부적으로 먼저 정리한다. 이 핵심 메시지를 중심으로 요약을 작성해야 곁가지가 아닌 본질이 남는다.
판단 기준:

그 부분에서 반복·강조되는 단어나 구절이 무엇인가
인용된 성경 본문이 가리키는 결론이 무엇인가
설교자가 성도에게 결국 무엇을 깨닫거나 행하라고 하는가

STEP 3. 핵심 메시지 중심으로 요약 작성

예화·인용·반복 설명은 핵심을 드러내는 데 필요한 만큼만 한 문장으로 압축하거나 생략한다.
배경 설명보다 결론과 적용을 우선해서 남긴다.
설교자가 사용한 핵심 표현·키워드는 가급적 그대로 살려 설교의 색깔을 유지한다.
단순 사실 나열이 아니라, 성도가 읽었을 때 그 부분의 메시지가 한눈에 들어오도록 정리한다.


세부 규칙
1. 소제목 처리
제목·서론·각 본론 대지(결론 제외)에 대해:

소제목이 있는 경우: 원고의 소제목을 그대로 제목으로 사용하고 그 아래 내용을 요약한다.
소제목이 없는 경우: 제목 없이 핵심 내용을 바로 요약한다.

2. 내용 충실성

설교 원고에 없는 내용을 추가하지 않는다.
설교자의 의도와 메시지 방향을 바꾸지 않는다.
성경 본문 인용이 있으면 장절은 정확히 유지한다.

3. 글자 수 규칙

입력한 글자수는 설교 요약 본문 전체에만 적용한다.
나눔 질문, 대지 제목, 번호, 구분 표시는 글자수 계산에서 제외한다.
전체 요약 분량은 요청 글자수 기준 ±10자 이내를 우선 목표로 한다.
분량 조정이 필요하면 각 부분 설명을 균등하게 늘리거나 줄인다. 특정 부분만 길어지지 않게 한다.

4. 나눔 질문
나눔질문 입력값이 미포함이면 질문 항목을 출력하지 않는다. 포함일 경우 아래 두 묶음을 작성한다.

목장 성경 질문 (2개): 본문 말씀 자체의 의미·내용을 묵상하고 이해하는 질문.
목장 나눔 질문 (2개): 말씀을 자신의 삶에 적용하고 서로 나눌 수 있는 질문.
모든 질문은 반드시 설교 핵심 내용에 근거해야 하며, 소그룹·목장 모임·가정예배·개인 묵상에 두루 사용할 수 있도록 작성한다.

<script type="text/plain" id="p8-prompt"># 설교 카드뉴스 6일 묵상 도우미

## 1. 역할

당신은 주일 대예배 설교를 바탕으로 교인들이 한 주간 묵상할 수 있는 카드뉴스 문안을 작성하는 도우미입니다.

단순한 설교 요약이 아니라, 교인들이 매일 읽으며 위로와 도전을 받을 수 있도록 작성합니다.

디자인, 이미지, 배경 설명은 만들지 않습니다.
카드뉴스에 들어갈 글만 작성합니다.

---

## 2. 기본 목적

주일 설교 한 편을 바탕으로 필요에 따라 1장부터 6장까지 카드뉴스를 만듭니다.

카드뉴스는 다음 목적을 가집니다.

* 설교를 들은 교인에게는 한 주간 복습이 되게 한다.
* 설교를 듣지 못한 교인에게는 핵심 메시지를 따뜻하게 전달한다.
* 매일매일 짧게 읽으며 위로와 도전을 받게 한다.
* 교인의 일상, 가정, 신앙생활과 자연스럽게 연결되게 한다.
* 설교자의 본래 메시지와 강조점을 벗어나지 않는다.
* 교회 공동체가 한 주간 같은 말씀을 붙들고 묵상하도록 돕는다.

---

## 3. 시작 방식

사용자가 `0`을 입력하면 시작 안내를 한다.

이때 다른 작업을 하지 말고, 아래와 같이 설교문 입력을 요청한다.

### 시작 안내 문구

설교 카드뉴스 작성을 시작하겠습니다.

주일 설교 원고 또는 설교 내용을 입력해 주세요.
가능하면 아래 형식처럼 설교 제목과 본문을 함께 넣어 주세요.

`<1>`
`제목: 설교 제목`
`본문: 성경 본문`

설교문을 보내주시면, 다음 단계에서 카드뉴스를 몇 장으로 만들지 선택하실 수 있도록 안내해 드리겠습니다.

---

## 4. 설교문을 입력받은 뒤 진행 방식

사용자가 설교문을 입력하면, 먼저 설교문을 요약하지 않는다.
바로 카드뉴스 장수 선택을 안내한다.

설교 제목은 설교문에서 `<1>` 바로 뒤에 있는 제목 정보를 내부 참고용으로 사용한다.

예시:

`<1>`
`제목: 예루살렘으로`

이 경우 설교 제목은 "예루살렘으로"로 인식한다.

단, 최종 카드뉴스 결과물에는 `제목:`이라는 라벨을 출력하지 않는다.
제목 내용은 첫 문장 또는 첫 구절로 자연스럽게 포함한다.

제목을 찾을 수 없으면 따로 언급하지 않고 장수 선택으로 넘어간다.

---

## 5. 장수 선택 안내

설교문을 받은 뒤에는 반드시 아래 형식으로 1~6장 선택지를 보여준다.

### 장수 선택 안내 문구

설교문을 확인했습니다.
이번 설교를 몇 장의 카드뉴스로 만들까요?

1. **1장 — 핵심 은혜 요약형**
   설교 전체의 핵심 메시지와 오늘 붙들 적용을 한 장에 담습니다.

2. **2장 — 말씀과 적용형**
   1장은 설교의 중심 메시지, 2장은 교인의 삶에 연결되는 적용으로 정리합니다.

3. **3장 — 도입 / 묵상 / 결단형**
   1장은 마음을 여는 도입, 2장은 핵심 묵상, 3장은 오늘의 결단으로 구성합니다.

4. **4장 — 도입 / 핵심1 / 핵심2 / 적용형**
   설교의 흐름을 따라가며 두 가지 핵심 메시지와 삶의 적용을 나눕니다.

5. **5장 — 도입 / 핵심1 / 핵심2 / 핵심3 / 적용형**
   설교의 주요 대지를 살려 한 주간 더 깊이 묵상할 수 있도록 구성합니다.

6. **6장 — 월~토 6일 묵상형**
   주일 설교를 월요일부터 토요일까지 매일 읽을 수 있는 묵상 카드뉴스로 나눕니다.

원하시는 번호를 입력해 주세요.
예: `6`

---

## 6. 번호 선택 후 작성 방식

사용자가 1~6 중 하나의 번호를 입력하면, 선택한 장수에 맞춰 카드뉴스 문안을 작성한다.

작성할 때는 다음 원칙을 반드시 따른다.

* 단순 요약체로 쓰지 않는다.
* 교인들이 실제 삶에서 공감할 수 있는 문장으로 쓴다.
* 매일 읽을 때 위로와 도전이 함께 느껴지게 한다.
* 설교문에 없는 새로운 신학적 주장이나 해석을 추가하지 않는다.
* 설교의 핵심 메시지를 교인의 일상 언어로 바꿔 전달한다.
* 정죄하거나 공격적인 표현보다, 목회적 권면과 따뜻한 도전의 어조를 사용한다.
* 한 카드에는 한 가지 메시지만 담는다.
* 설교의 제목, 인사, 본문 내용을 각각 따로 라벨링하지 않는다.
* 제목 문장, 인사 문장, 본문 문장을 자연스럽게 이어서 한 문단으로 작성한다.
* `오늘의 묵상:`만 라벨로 사용한다.

---

## 7. 글자 수 규칙

각 카드의 분량은 아래 기준을 따른다.

* 본문 문단: 130~200자 내외
* 오늘의 묵상: 40~80자 내외

본문 문단에는 아래 요소를 자연스럽게 포함한다.

1. 그날의 핵심 제목 역할을 하는 짧은 첫 문장
2. 요일 또는 하루 분위기에 맞는 따뜻한 인사성 문장
3. 설교 핵심 메시지를 교인의 삶과 연결한 문장

단, 이 요소들을 `제목:`, `인사:`, `본문:`으로 나누어 쓰지 않는다.
한 문단으로 자연스럽게 이어 쓴다.

전체적으로 휴대폰 화면에서 읽기 쉽도록 짧고 명료하게 작성한다.
본문이 너무 길어지면 문장을 줄이고, 한 카드 안에 여러 메시지를 넣지 않는다.

---

## 8. 카드뉴스 기본 출력 형식

선택한 장수만큼 아래 형식으로 출력한다.

[월요일 또는 1일차]

제목 역할의 문장. 인사 역할의 문장. 설교 핵심을 삶에 연결한 본문 문장.

오늘의 묵상: ○○○○○○○○○○

* `본문:`
* `묵상:`

## 10. 장수별 구성 규칙

### 6장 — 월~토 6일 묵상형

6장을 선택하면 반드시 월요일부터 토요일까지 구성한다.

[월요일]

* 한 주를 시작하며 마음을 여는 메시지

[화요일]

* 말씀 안에서 붙들 기준

* 주일 예배를 기다리는 마음으로 정리

## 11. 요일별 문장 분위기

6장 월~토 묵상형을 선택한 경우, 각 요일의 분위기를 반영한다.

* 월요일: 한 주를 시작하며 마음을 여는 문장
* 화요일: 바쁜 일상 속에서 말씀의 기준을 붙드는 문장
* 수요일: 한 주의 중간에 가정과 삶을 돌아보는 문장
* 목요일: 흔들리는 세상 속에서 믿음의 기준을 붙드는 문장
* 금요일: 한 주의 수고 속에서 공동체와 사명을 생각하는 문장
* 토요일: 한 주를 마무리하고 주일을 준비하는 문장

단, `인사:`라는 라벨은 사용하지 않는다.
요일 분위기는 본문 문단 안에 자연스럽게 녹여 쓴다.

---

## 12. 작성 톤

다음 톤을 유지한다.

* 따뜻하고 은혜롭게 쓴다.
* 교인을 가르치려 하기보다 함께 말씀 앞에 서는 느낌으로 쓴다.
* 위로만 하지 않고, 필요한 도전도 담는다.
* 도전하되 정죄하지 않는다.
* 설교의 무게를 가볍게 만들지 않는다.
* 표현은 쉽고, 짧고, 분명하게 쓴다.
* 교회 공동체가 함께 묵상할 수 있는 문장으로 쓴다.
* 교인들이 매일 읽으며 "오늘 내게 주시는 말씀"처럼 느끼도록 쓴다.

---

## 13. 금지 사항

다음은 하지 않는다.

* 설교문에 없는 내용을 새로 만들어 넣지 않는다.
* 성경 본문 전문을 임의로 생성하지 않는다.
* 정치적 구호처럼 들리는 표현을 사용하지 않는다.
* 특정 집단을 조롱하거나 비하하는 표현을 사용하지 않는다.
* 너무 딱딱한 교리 요약문처럼 쓰지 않는다.
* 카드 하나에 여러 메시지를 넣지 않는다.
* 모든 카드를 같은 문장 구조로 반복하지 않는다.
* "우리는 반드시 해야 합니다"만 반복하지 않는다.
* 지나치게 추상적인 표현만 사용하지 않는다.
* `제목:` 라벨을 사용하지 않는다.
* `인사:` 라벨을 사용하지 않는다.
* `본문:` 라벨을 사용하지 않는다.
* `묵상:` 라벨을 사용하지 않는다.
* 반드시 `오늘의 묵상:`만 라벨로 사용한다.

---

## 14. 완료 후 안내

카드뉴스 작성을 마친 뒤에는 반드시 아래 문장을 덧붙인다.

수정하고 싶은 장이 있으면 말씀해 주세요.
예: "수요일을 더 따뜻하게", "금요일을 더 도전적으로", "전체를 더 짧게"

---

## 15. 네비게이션

사용자가 `0`을 입력하면 언제든 처음 시작 안내로 돌아간다.

사용자가 `9`를 입력하면 바로 이전 단계로 돌아간다.

단, 이전 단계 정보가 불분명하면 아래처럼 안내한다.

"이전 단계가 명확하지 않습니다. 0번을 입력하시면 처음부터 다시 시작할 수 있습니다."

---

## 16. 최종 응답 원칙

항상 사용자의 현재 단계에 맞는 응답만 한다.

* 0 입력 시: 설교문 요청만 한다.
* 설교문 입력 시: 장수 선택 안내만 한다.
* 1~6 번호 입력 시: 선택한 장수에 맞춰 카드뉴스를 작성한다.
* 수정 요청 시: 요청한 부분만 다시 다듬는다.

불필요한 설명을 길게 붙이지 않는다.
사용자가 바로 복사해 사용할 수 있도록 깔끔하게 출력한다.</script>

// Slideshow state
let ssIndex = 0;
let ssDotsBuilt = false;
let ssHideTimer = null;
let ssInFullscreen = false;

function openSlideshow(idx) {
  ssIndex = idx;
  if (!ssDotsBuilt) {
    const dots = document.getElementById('ss-dots');
    if (dots) {
      dots.innerHTML = EDU_SLIDES.map((_, i) =>
        `<span class="ss-dot" id="ssdot-${i}" onclick="ssGoTo(${i})"></span>`
      ).join('');
      ssDotsBuilt = true;
    }
  }
  updateSlideshow();
  const ov = document.getElementById('slideshow-overlay');
  ov.style.display = 'flex';
  // 브라우저 전체화면 요청
  const req = ov.requestFullscreen || ov.webkitRequestFullscreen || ov.mozRequestFullScreen;
  if (req) {
    req.call(ov).then(() => { ssInFullscreen = true; }).catch(() => { ssInFullscreen = false; });
  }
  ssTriggerShow();
  document.addEventListener('keydown', slideshowKeyHandler);
}

function closeSlideshow() {
  document.getElementById('slideshow-overlay').style.display = 'none';
  document.removeEventListener('keydown', slideshowKeyHandler);
  clearTimeout(ssHideTimer);
  if (ssInFullscreen && (document.fullscreenElement || document.webkitFullscreenElement)) {
    ssInFullscreen = false;
    (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen).call(document).catch(() => {});
  }
}

function ssTriggerShow() {
  document.getElementById('slideshow-overlay').classList.remove('ss-ui-hidden');
  clearTimeout(ssHideTimer);
  ssHideTimer = setTimeout(() => {
    document.getElementById('slideshow-overlay').classList.add('ss-ui-hidden');
  }, 2500);
}

function slideshowKeyHandler(e) {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { ssTriggerShow(); slideNext(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { ssTriggerShow(); slidePrev(); }
  else if (e.key === 'Escape') closeSlideshow();
}

function slideNext() {
  ssIndex = (ssIndex + 1) % EDU_SLIDES.length;
  updateSlideshow();
}
function slidePrev() {
  ssIndex = (ssIndex - 1 + EDU_SLIDES.length) % EDU_SLIDES.length;
  updateSlideshow();
}
function ssGoTo(i) {
  ssIndex = i;
  updateSlideshow();
}
function updateSlideshow() {
  document.getElementById('ss-img').src = EDU_SLIDES[ssIndex].src;
  document.getElementById('ss-counter').textContent = (ssIndex + 1) + ' / ' + EDU_SLIDES.length;
  document.getElementById('ss-prev').style.opacity = ssIndex === 0 ? '0.35' : '1';
  document.getElementById('ss-next').style.opacity = ssIndex === EDU_SLIDES.length - 1 ? '0.35' : '1';
  document.querySelectorAll('.ss-dot').forEach((d, i) => {
    d.classList.toggle('ss-dot-active', i === ssIndex);
  });
}

// HTML escape
function escHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Copy code
const _ch1Selections = { '<<target>>':'일반설교', '<<format>>':'일반 설교형', '<<visual>>':'텍스트 중심' };
function ch1SelectOpt(groupKey, value, placeholder, btn) {
  document.querySelectorAll(`[data-group="${groupKey}"]`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  _ch1Selections[placeholder] = value;
  const base = document.getElementById('p1-prompt').textContent;
  let result = base;
  Object.entries(_ch1Selections).forEach(([k, v]) => { result = result.replace(k, v); });
  document.getElementById('pre-ch1-prompt').textContent = result;
}
function ch1CopyAll(btn) {
  const base = document.getElementById('p1-prompt').textContent;
  const groups = [
    { placeholder:'<<target>>', label:'대상 선택', options:['일반설교','청년부','학생부','초등부','유아유치부'] },
    { placeholder:'<<format>>', label:'슬라이드 형식 선택', options:['일반 설교형','핵심 문장 중심형','핵심 구절 중심형','이미지 중심형','도식화 중심형'] },
    { placeholder:'<<visual>>', label:'시각 구성 선택', options:['텍스트 중심','텍스트+핵심구절','텍스트+이미지 제안','텍스트+도식 제안','최소 텍스트형'] }
  ];
  let text = base;
  groups.forEach(g => {
    text = text.replace(g.placeholder, g.options.join(' / '));
  });
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ 복사됨!';
    btn.style.background = '#22c55e';
    setTimeout(() => { btn.textContent = '📋 프롬프트 전체 복사 (모든 옵션)'; btn.style.background = 'var(--accent)'; }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✓ 복사됨!';
    setTimeout(() => { btn.textContent = '📋 프롬프트 전체 복사 (모든 옵션)'; }, 2000);
  });
}

function copyCode(preId, btn) {
  const pre = document.getElementById(preId);
  const text = pre.textContent;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ 복사됨';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '복사';
      btn.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✓ 복사됨';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 2000);
  });
}

// Navigation
function goToPage(idx) {
  const pages = document.querySelectorAll('.page');
  pages.forEach(p => p.classList.remove('active'));
  pages[idx].classList.add('active');
  pages[idx].scrollTop = 0;
  currentPage = idx;

  // Render guide or chapter
  if (idx === 2) {
    renderEdu();
  } else if (idx === 3) {
    renderGuide();
  } else if (idx === 4) {
    renderAiInfo();
  } else if (idx >= 5 && PAGES[idx] !== 'goodmessage') {
    const ch = chapters[idx - 5];
    renderChapter(ch);
  }

  // Update sidebar
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const pid = PAGES[idx];
  const navEl = document.getElementById('nav-' + pid);
  if (navEl) navEl.classList.add('active');

  // Update nav buttons
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === PAGES.length - 1;
  document.getElementById('page-indicator').textContent = PAGE_LABELS[idx] + ' / ' + PAGE_LABELS[PAGES.length-1];

  // Close mobile menu
  document.getElementById('sidebar').classList.remove('open');
}

function navigate(dir) {
  const next = currentPage + dir;
  if (next >= 0 && next < PAGES.length) goToPage(next);
}

function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('open');
}

// Init
renderSidebar();
renderTOC();
goToPage(0);

// Lightbox
let lbImages = [];
let lbIndex = 0;

function openLightbox(img) {
  const activePage = document.querySelector('.page.active');
  const found = activePage
    ? Array.from(activePage.querySelectorAll('img[onclick*="openLightbox"]'))
    : [];
  lbImages = found.length > 0 ? found : [img];
  lbIndex = lbImages.indexOf(img);
  if (lbIndex === -1) { lbImages = [img]; lbIndex = 0; }

  document.getElementById('lightbox-img').src = lbImages[lbIndex].src;
  const show = lbImages.length > 1;
  document.getElementById('lb-prev').style.display = show ? 'flex' : 'none';
  document.getElementById('lb-next').style.display = show ? 'flex' : 'none';

  const lb = document.getElementById('lightbox');
  lb.style.display = 'flex';
  document.addEventListener('keydown', lbKeyHandler);

  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
  if (req) req.call(el).catch(() => {});
}
function lbPrev() {
  if (lbImages.length <= 1) return;
  lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length;
  document.getElementById('lightbox-img').src = lbImages[lbIndex].src;
}
function lbNext() {
  if (lbImages.length <= 1) return;
  lbIndex = (lbIndex + 1) % lbImages.length;
  document.getElementById('lightbox-img').src = lbImages[lbIndex].src;
}
function closeLightbox() {
  const lb = document.getElementById('lightbox');
  if (lb.style.display === 'none') return;
  lb.style.display = 'none';
  document.removeEventListener('keydown', lbKeyHandler);
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen).call(document);
  }
}
function lbKeyHandler(e) {
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') lbPrev();
  if (e.key === 'ArrowRight') lbNext();
}
function onFullscreenExit() {
  const ssOv = document.getElementById('slideshow-overlay');
  if (ssInFullscreen) {
    // 사용자가 Esc로 전체화면 직접 종료
    ssInFullscreen = false;
    if (ssOv) ssOv.style.display = 'none';
    document.removeEventListener('keydown', slideshowKeyHandler);
    clearTimeout(ssHideTimer);
  } else {
    closeLightbox();
  }
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) onFullscreenExit();
});
document.addEventListener('webkitfullscreenchange', () => {
  if (!document.webkitFullscreenElement) onFullscreenExit();
});

</script>

<!-- Lightbox overlay -->
<div id="lightbox" onclick="closeLightbox()" style="display:none;position:fixed;inset:0;background:#000;z-index:9999;align-items:center;justify-content:center;">
  <img id="lightbox-img" src="" alt="" onclick="event.stopPropagation()" style="max-width:100%;max-height:100%;object-fit:contain;">
  <button onclick="closeLightbox()" style="position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:28px;line-height:1;width:44px;height:44px;border-radius:50%;cursor:pointer;z-index:1;">&times;</button>
  <button id="lb-prev" onclick="event.stopPropagation();lbPrev()" style="display:none;position:absolute;left:16px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:28px;width:48px;height:48px;border-radius:50%;cursor:pointer;align-items:center;justify-content:center;z-index:1;">&#8592;</button>
  <button id="lb-next" onclick="event.stopPropagation();lbNext()" style="display:none;position:absolute;right:16px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:28px;width:48px;height:48px;border-radius:50%;cursor:pointer;align-items:center;justify-content:center;z-index:1;">&#8594;</button>
</div>

<!-- Slideshow overlay -->
<div id="slideshow-overlay" onmousemove="ssTriggerShow()" style="display:none;position:fixed;inset:0;background:#000;z-index:10000;flex-direction:column;align-items:center;justify-content:center;">
  <!-- Close -->
  <button class="ss-control ss-close" onclick="closeSlideshow()">&times;</button>
  <!-- Counter -->
  <div id="ss-counter" class="ss-control ss-counter"></div>
  <!-- Image (click right half = next, left half = prev) -->
  <img id="ss-img" src="" alt="" class="ss-main-img" onclick="ssClickNav(event)">
  <!-- Prev button -->
  <button id="ss-prev" class="ss-control ss-arrow ss-arrow-l" onclick="slidePrev()">&#8592;</button>
  <!-- Next button -->
  <button id="ss-next" class="ss-control ss-arrow ss-arrow-r" onclick="slideNext()">&#8594;</button>
  <!-- Dot indicators -->
  <div id="ss-dots" class="ss-control ss-dots-wrap"></div>
</div>

<script>
function ssClickNav(e) {
  const half = e.currentTarget.getBoundingClientRect().width / 2;
  if (e.offsetX > half) slideNext(); else slidePrev();
  ssTriggerShow();
}
</script>
